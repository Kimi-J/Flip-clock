<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip Clock · 翻页时钟</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Major+Mono+Display&display=swap"
      rel="stylesheet"
    />
    <!-- 像素字体(voxel 主题用):用 font.im 镜像确保中国境内可访问 -->
    <link
      href="https://fonts.font.im/css?family=Press+Start+2P"
      rel="stylesheet"
    />
    <!-- 毛笔书法字体(ink 主题用):ZCOOL QingKe HuangYou 站酷庆科黄油体,粗体飘逸规整,font.im 镜像 -->
    <link
      href="https://fonts.font.im/css?family=ZCOOL+QingKe+HuangYou"
      rel="stylesheet"
    />
    <!-- 圆胖数字字体(clay 主题用):Baloo 2,黏土风标配,圆润饱满 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <!-- 手写弹跳中文字体(clay 主题用):ZCOOL KuaiLe 站酷快乐体,font.im 镜像 -->
    <link
      href="https://fonts.font.im/css?family=ZCOOL+KuaiLe"
      rel="stylesheet"
    />
    <script>
      // 小部件窗口防暗闪:stylesheet 的 html/body/#root 底色在 React 挂载前就会
      // 绘制,透明窗口会先闪一块深色矩形;在样式表生效前给 <html> 打标记类,
      // CSS 对标记类全程强制透明(injected __LAUNCH_MODE__ 先于本脚本执行)
      if (
        window.__LAUNCH_MODE__ === 'widget' ||
        new URLSearchParams(location.search).get('mode') === 'widget'
      ) {
        document.documentElement.classList.add('widget-boot')
      }
    </script>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body style="background:#0a0a0f">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
